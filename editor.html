<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link href="img/64.png" rel="shortcut icon" />
    <link rel="icon" type="image/png" href="img/64.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!-- The editor route: /editor?new=docx|xlsx|pptx creates, /editor?file=<url> or
         ?src=<url> opens, /editor?embed=1 is the iframe integration surface, and
         /editor?open=local takes a file the landing page stashed in IndexedDB.
         The homepage / is a static landing page (index.html) that never loads the
         editor stack; it redirects legacy deep links (/?src=, /?embed=1, ...) here.
         Not a page for search engines. -->
    <title>Document Editor</title>
    <meta name="robots" content="noindex" />
    <!-- No-flash theme restore: apply a forced light/dark before first paint so a
         dark-mode visitor never sees a white flash. 'system' leaves the attributes
         off and the token layer's media query decides. Kept inline and tiny. -->
    <script>
      try {
        var t = localStorage.getItem('ran-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-ran-theme', t);
          document.documentElement.setAttribute('theme', t);
        }
      } catch (e) {}
    </script>
    <!-- ranui design-token layer (vendored from ranui/dist/ranui.css, re-synced by bin/build.sh).
         Loaded before home.css so the landing hero's --ran-* tokens resolve on first paint. -->
    <link rel="stylesheet" href="/ran-fonts/fonts.css" />
    <link rel="stylesheet" href="/ran-tokens.css" />
  </head>

  <body>
    <div id="app">
      <div id="iframe"></div>
    </div>

    <noscript>
      <p style="max-width: 720px; margin: 0 auto; padding: 24px; font-family: system-ui, sans-serif">
        This editor requires JavaScript to run. Please enable JavaScript to open or create a document.
      </p>
    </noscript>
  </body>
  <script type="module" src="./index.ts"></script>
  <script>
    /* ===== AI-EDIT bridge (POC v2) — 编辑指令 + 反向状态推送（选中/页码 → 宿主） ===== */
    (function () {
      var getEditor = function () {
        var frame = document.querySelector('iframe[name="frameEditor"]');
        var win = frame && frame.contentWindow;
        return win && (win.editor || (win.Asc && win.Asc.editor)) || null;
      };

      /* ===== 统一元素模型（用户交互契约 → AI 明确描述） ===== */
      var getElInner = function (el) { try { return el.asc_getObjectValue ? el.asc_getObjectValue() : null; } catch (e) { return null; } };
      var elHas = function (inner, n) { try { return !!(inner && typeof inner[n] === 'function'); } catch (e) { return false; } };
      var elCall = function (inner, names) { for (var i = 0; i < names.length; i++) { try { var f = inner && inner[names[i]]; if (typeof f === 'function') { var v = f(); if (v != null) return v; } } catch (e) {} } return null; };
      var classifyKind = function (el) {
        var t = null; try { t = el.asc_getObjectType ? el.asc_getObjectType() : null; } catch (e) {}
        var inner = getElInner(el);
        if (t === 7) return 'slide';
        if (t === 0) return 'text';
        if (elHas(inner, 'asc_getVideoUrl') || elHas(inner, 'GetVideoUrl')) return 'video';
        if (elHas(inner, 'asc_getAudioUrl')) return 'audio';
        if (elHas(inner, 'asc_getImageUrl') || elHas(inner, 'GetImageUrl')) return 'image';
        if (elHas(inner, 'asc_getChartProperties') || elHas(inner, 'GetChartType') || elHas(inner, 'asc_getChartType')) return 'chart';
        if (elHas(inner, 'asc_getTableProperties') || elHas(inner, 'GetRowsCount')) return 'table';
        if (elHas(inner, 'asc_getTextBody') || elHas(inner, 'asc_getCanEditText') || elHas(inner, 'asc_getTextArtProperties')) return 'textbox';
        if (t === 6) return 'shape';
        return 'unknown';
      };
      var actionsFor = function (kind) {
        switch (kind) {
          case 'textbox': case 'text': return ['setText', 'setStyle', 'delete', 'duplicate'];
          case 'image': return ['setImage', 'delete', 'duplicate', 'setPosition'];
          case 'video': return ['setVideo', 'delete', 'setPosition'];
          case 'chart': return ['setTitle', 'delete', 'setPosition'];
          case 'table': return ['setCell', 'delete', 'setPosition'];
          case 'shape': return ['setStyle', 'delete', 'duplicate', 'setPosition'];
          case 'slide': return ['duplicate', 'delete', 'move'];
          default: return ['delete', 'duplicate'];
        }
      };
      var describeOne = function (el) {
        var kind = classifyKind(el);
        var inner = getElInner(el);
        var rec = { kind: kind };
        try { var nm = elCall(inner, ['asc_getName', 'get_Name', 'asc_getTitle', 'get_Title']); if (nm != null && String(nm) !== 'frameEditor') rec.name = String(nm).slice(0, 120); } catch (e) {}
        var g = {};
        try {
          var getP = function (n) { try { var f = inner && inner[n]; if (typeof f === 'function') { var v = f(); return (typeof v === 'number') ? v : null; } } catch (e) {} return null; };
          var x = getP('asc_getX') || getP('get_X'), y = getP('asc_getY') || getP('get_Y');
          var w = getP('asc_getWidth') || getP('get_Width'), h = getP('asc_getHeight') || getP('get_Height');
          if (x != null && y != null) g = { x: Math.round(x), y: Math.round(y), w: Math.round(w || 0), h: Math.round(h || 0) };
        } catch (e) {}
        if (Object.keys(g).length) rec.geometry = g;
        var content = {};
        switch (kind) {
          case 'textbox': case 'text': { var txt = elCall(inner, ['GetText', 'asc_getText', 'get_Text', 'GetTextContent']); if (txt != null) content.text = String(txt).slice(0, 400); break; }
          case 'image': { var u = elCall(inner, ['asc_getImageUrl', 'GetImageUrl']); if (u != null) content.url = String(u).slice(0, 300); break; }
          case 'video': { var uv = elCall(inner, ['asc_getVideoUrl', 'GetVideoUrl']); if (uv != null) content.url = String(uv).slice(0, 300); break; }
          case 'chart': { var ct = elCall(inner, ['asc_getChartType', 'GetChartType']); if (ct != null) content.chartType = String(ct).slice(0, 80); var tt = elCall(inner, ['asc_getTitle', 'GetTitle']); if (tt != null) content.title = String(tt).slice(0, 120); break; }
          case 'table': { var r = elCall(inner, ['GetRowsCount', 'asc_getRowsCount']), c = elCall(inner, ['GetColsCount', 'asc_getColsCount']); content.rows = r != null ? Number(r) : null; content.cols = c != null ? Number(c) : null; break; }
          case 'shape': { var st = elCall(inner, ['asc_getType', 'get_Type']); if (st != null) content.shapeType = String(st).slice(0, 80); var tt2 = elCall(inner, ['asc_getTitle', 'GetTitle']); if (tt2 != null) content.title = String(tt2).slice(0, 120); break; }
        }
        if (Object.keys(content).length) rec.content = content;
        rec.actions = actionsFor(kind);
        return rec;
      };
      var normalizeInteraction = function (editor) {
        var st = { at: Date.now(), page: null, action: { type: 'none', detail: '无操作' }, selection: { mode: 'none', kind: 'none', elements: [] }, selectedElement: null };
        var st0 = 'none';
        try { st0 = editor.pluginMethod_GetSelectionType ? editor.pluginMethod_GetSelectionType() : 'none'; } catch (e) {}
        var selText = '';
        try { selText = editor.pluginMethod_GetSelectedText ? editor.pluginMethod_GetSelectedText() : ''; } catch (e) {}
        var pageFns = ['GetCurrentPage', 'getCurrentPage', 'GetCurrentVisiblePage', 'GetCurrentSlideNumber', 'GetCurrentSlide'];
        for (var i = 0; i < pageFns.length; i++) { try { var v = editor[pageFns[i]] ? editor[pageFns[i]]() : undefined; if (v != null) { st.page = Number(v) + 1; break; } } catch (e) {} }
        var els = [];
        try { els = editor.getSelectedElements ? editor.getSelectedElements() : []; } catch (e) {}
        var descs = [];
        for (var j = 0; j < els.length && j < 8; j++) descs.push(describeOne(els[j]));
        st.selection.elements = descs;
        if (selText) {
          st.selection.mode = 'text'; st.selection.kind = 'text'; st.selection.text = selText.slice(0, 500);
          st.action.type = 'select'; st.action.detail = '选择文字';
        } else if (st0 !== 'none' && st0 != null) {
          st.selection.mode = 'object';
          var mainKind = 'unknown';
          for (var k2 = 0; k2 < descs.length; k2++) { if (descs[k2].kind !== 'slide' && descs[k2].kind !== 'animation') { mainKind = descs[k2].kind; break; } }
          if (mainKind === 'unknown') for (var k3 = 0; k3 < descs.length; k3++) { if (descs[k3].kind !== 'animation') { mainKind = descs[k3].kind; break; } }
          st.selection.kind = mainKind;
          st.action.type = 'select'; st.action.detail = '点选元素（' + mainKind + '）';
        } else {
          st.selection.mode = 'none'; st.action.type = 'none'; st.action.detail = '无选中';
        }
        /* 从 spTree 读用户选中的元素（selected=true）→ 收集全部（支持多选/框选） */
        st.selectedElements = [];
        try {
          var ld = editor.WordControl.m_oLogicDocument;
          for (var si = 0; si < ld.Slides.length; si++) {
            var spx = ld.Slides[si].cSld.spTree;
            if (!spx) continue;
            for (var jj = 0; jj < spx.length; jj++) {
              var shx = spx[jj];
              if (shx.selected) {
                var info = { pageIdx: si, shapeIdx: jj, kind: 'shape' };
                try { info.name = shx.name != null ? String(shx.name) : null; } catch (e) {}
                try { info.x = shx.GetPosX ? shx.GetPosX() : shx.x; info.y = shx.GetPosY ? shx.GetPosY() : shx.y; info.w = shx.extX; info.h = shx.extY; } catch (e) {}
                /* 按类型默认提供 value */
                try { var dcx = shx.getDocContent ? shx.getDocContent() : null; if (dcx && typeof dcx.GetText === 'function') { var tt = String(dcx.GetText()); if (tt.trim()) { info.kind = 'textbox'; info.value = tt.replace(/\r\n/g, '\\n').slice(0, 400); } } } catch (e) {}
                try { if (shx.videoLink) { info.kind = 'video'; info.value = { name: info.name, url: String(shx.videoLink) }; } } catch (e) {}
                try { if (shx.audioLink) { info.kind = 'audio'; info.value = { name: info.name, url: String(shx.audioLink) }; } } catch (e) {}
                try { if (shx.getDrawingBaseType) { var dbt = shx.getDrawingBaseType(); if (dbt && String(dbt).toLowerCase().indexOf('image') !== -1) { info.kind = 'image'; } } } catch (e) {}
                st.selectedElements.push(info);
                if (st.action.type !== 'select') { st.action.type = 'select'; st.action.detail = '点选元素' + (info.kind ? '（' + info.kind + '）' : '') + (st.selectedElements.length > 1 ? '（多选' + st.selectedElements.length + '）' : ''); }
              }
            }
          }
          /* 向后兼容：单选场景 still 暴露 selectedElement（取第一个） */
          st.selectedElement = st.selectedElements.length === 1 ? st.selectedElements[0] : (st.selectedElements.length > 1 ? st.selectedElements : null);
        } catch (e) {}
        return st;
      };
      /* Word（documenteditor）交互状态：selection 用 paraId + selectedText + paragraphText 定位（对齐 office-studio 契约） */
      var normalizeWordInteraction = function (editor) {
        var st = {
          at: Date.now(),
          kind: 'word',
          mode: 'cursor',
          page: 0,
          location: { paraIndex: -1, paraId: '', paragraphText: '', cursorX: null, cursorY: null, inTable: false },
          selection: { type: 'none', selectedText: '', startPara: -1, endPara: -1, objects: [] },
          viewport: { currentPage: 0, totalPages: 0 },
          action: { type: 'none', detail: '无操作' },
        };
        try {
          var ld = editor.WordControl.m_oLogicDocument;
          var page0 = ld.GetCurPage ? Number(ld.GetCurPage()) : 0;
          var sel = '';
          try { sel = String(editor.pluginMethod_GetSelectedText ? editor.pluginMethod_GetSelectedText() : ''); } catch (e) {}
          var p = ld.GetCurrentParagraph ? ld.GetCurrentParagraph() : null;
          var pid = '';
          try {
            if (p && typeof p.GetId === 'function') {
              var rawId = p.GetId();
              var pidStr = rawId == null ? '' : String(rawId);
              /* 表格单元格段落无 w14:paraId，GetId() 返回 "undefined_xxx" 类内部 id → 置空 */
              if (pidStr && pidStr.indexOf('undefined') === -1) pid = pidStr.slice(0, 32);
            }
          } catch (e) {}
          /* 段落索引：全文定位锚（正文/表格单元格/任意插入点都是段落） */
          var paraIndex = -1;
          try {
            var paras = ld.GetAllParagraphs ? ld.GetAllParagraphs() : [];
            for (var pi = 0; pi < paras.length; pi++) { if (paras[pi] === p) { paraIndex = pi; break; } }
          } catch (e) {}
          /* 像素坐标：精确光标位置 */
          var cx = null, cy = null;
          try { var cr = ld.GetCursorRealPosition ? ld.GetCursorRealPosition() : null; if (cr) { cx = Number(cr.X); cy = Number(cr.Y); } } catch (e) {}
          var inTable = false;
          try { inTable = !!(ld.GetCurrentTable && ld.GetCurrentTable()); } catch (e) {}
          var paraText = p && typeof p.GetText === 'function' ? String(p.GetText()) : '';
          /* 选中范围内的对象（图片/图表/OLE/形状）——DrawingType: 0=shape 1=image 2=chart 3=smartArt 4=ole 5=video 6=audio */
          var objs = [];
          try {
            var drawObjs = ld.GetSelectedDrawingObjectsInText ? ld.GetSelectedDrawingObjectsInText() : [];
            for (var oi = 0; oi < drawObjs.length && oi < 8; oi++) {
              var d = drawObjs[oi];
              var dt = d && d.DrawingType;
              var kind = dt === 1 ? 'image' : dt === 2 ? 'chart' : dt === 4 ? 'ole' : dt === 0 ? 'shape' : dt === 5 ? 'video' : 'object';
              var rec = { kind: kind, drawingType: dt == null ? null : Number(dt) };
              try { var t = d.getTitle ? d.getTitle() : null; if (t) rec.title = String(t).slice(0, 60); } catch (e) {}
              objs.push(rec);
            }
          } catch (e) {}
          /* 选区段落：起止索引（准确 startPara/endPara）+ 表格检测（IsTableCellContent） */
          var selFirst = -1, selLast = -1, selCellCount = 0;
          try {
            var selParas = ld.GetSelectedParagraphs ? ld.GetSelectedParagraphs() : [];
            if (selParas.length > 0 && paras.length > 0) {
              var firstIdx = -1, lastIdx = -1;
              for (var si = 0; si < selParas.length; si++) {
                for (var ti = 0; ti < paras.length; ti++) {
                  if (paras[ti] === selParas[si]) { if (firstIdx < 0 || ti < firstIdx) firstIdx = ti; if (ti > lastIdx) lastIdx = ti; break; }
                }
                try { if (selParas[si].IsTableCellContent && selParas[si].IsTableCellContent()) selCellCount++; } catch (e2) {}
              }
              selFirst = firstIdx; selLast = lastIdx;
            }
          } catch (e) {}
          if (selCellCount > 0) objs.push({ kind: 'table', cellCount: selCellCount });
          /* 完整位置（鼠标在哪里） */
          st.page = page0 + 1;
          st.location = {
            paraIndex: paraIndex,
            paraId: pid,
            paragraphText: paraText.slice(0, 1000),
            cursorX: cx == null ? null : Math.round(cx * 100) / 100,
            cursorY: cy == null ? null : Math.round(cy * 100) / 100,
            inTable: inTable,
          };
          /* 选择类型：none / text / drawing（点选对象） */
          var selType = 'none';
          try { selType = editor.pluginMethod_GetSelectionType ? editor.pluginMethod_GetSelectionType() : 'none'; } catch (e) {}
          /* 完整选择（选中了什么）：点选对象 → selection(objects)；文本 → selection(text/mixed)；点击 → cursor */
          if (selType === 'drawing') {
            /* 点选对象（图片/图表/形状/OLE）：getSelectedElements() + Value 详情 */
            var selObjs = [];
            try {
              var els = editor.getSelectedElements ? editor.getSelectedElements() : [];
              for (var ei = 0; ei < els.length && ei < 8; ei++) {
                var el = els[ei];
                var ot = el.asc_getObjectType ? el.asc_getObjectType() : -1;
                var okind = ot === 2 ? 'image' : ot === 3 ? 'chart' : ot === 4 ? 'ole' : ot === 1 ? 'shape' : ot === 0 ? 'text' : 'object';
                var orec = { kind: okind, objectType: ot == null ? null : Number(ot) };
                try {
                  var ov = el.Value;
                  if (ov) {
                    if (ov.ImageUrl) orec.url = String(ov.ImageUrl).slice(0, 200);
                    if (ov.Width != null) orec.width = Math.round(Number(ov.Width));
                    if (ov.Height != null) orec.height = Math.round(Number(ov.Height));
                    if (ov.ChartProperties) orec.chart = true;
                  }
                } catch (e2) {}
                selObjs.push(orec);
              }
            } catch (e) {}
            st.mode = 'selection';
            st.selection = {
              type: selObjs.length > 0 ? 'objects' : 'none',
              selectedText: '',
              startPara: paraIndex,
              endPara: paraIndex,
              objects: selObjs,
            };
            st.action = { type: 'select', detail: '点选 ' + (selObjs.length > 0 ? selObjs.length + ' 个对象' : '对象') };
          } else if (sel) {
            st.mode = 'selection';
            st.selection = {
              type: objs.length > 0 ? 'mixed' : 'text',
              selectedText: sel.slice(0, 2000),
              startPara: selFirst >= 0 ? selFirst : paraIndex,
              endPara: selLast >= 0 ? selLast : paraIndex,
              objects: objs,
            };
            st.action = { type: 'select', detail: '选择' + (objs.length > 0 ? '文本+对象' : '文本') };
          } else {
            st.mode = 'cursor';
            st.selection = { type: 'none', selectedText: '', startPara: -1, endPara: -1, objects: objs };
            st.action = { type: 'cursor', detail: '光标位于段落 ' + (paraIndex >= 0 ? '#' + paraIndex : pid) };
          }
          st.viewport = { currentPage: page0 + 1, totalPages: ld.GetPageCount ? Number(ld.GetPageCount()) : 1 };
        } catch (e) {
          st.action = { type: 'none', detail: '读取失败: ' + e.message };
        }
        return st;
      };
      var isWordEditor = function (editor) {
        try {
          var ld = editor.WordControl && editor.WordControl.m_oLogicDocument;
          return !!(ld && !ld.Slides && typeof ld.GetCurrentParagraph === 'function');
        } catch (e) { return false; }
      };
      /* 事件推送 / 主动查询统一走 readState（按文档类型分派） */
      var readState = function (editor) {
        return isWordEditor(editor) ? normalizeWordInteraction(editor) : normalizeInteraction(editor);
      };

      /* 反向推送（节流 250ms）→ viewer */
      var lastPush = 0;
      var pushState = function () {
        var now = Date.now();
        if (now - lastPush < 250) return;
        lastPush = now;
        var editor = getEditor();
        if (!editor) return;
        try { window.parent.postMessage({ aiEvent: true, state: readState(editor) }, '*'); } catch (e) {}
      };

      /* 编辑器就绪后注册事件（幂等，轮询探测注册时机） */
      var registerEvents = function () {
        var editor = getEditor();
        if (!editor || editor.__aiEvents) return;
        editor.__aiEvents = true;
        var evs = ['asc_onEditorSelectionChanged', 'asc_onCurrentVisiblePage', 'asc_onDocumentChanged', 'asc_onSelectionEnd'];
        for (var i = 0; i < evs.length; i++) {
          (function (name) {
            try { editor.asc_registerCallback(name, function () { pushState(); }); } catch (e) {}
          })(evs[i]);
        }
      };
      setInterval(registerEvents, 1200);

      /* JSON 参数里没法带函数 → __fn / __fns 占位符 */
      var materialize = function (a) {
        if (a && typeof a === 'object' && a.__fn) { var o = {}; o[a.__fn] = function () { return a.returns; }; return o; }
        if (a && typeof a === 'object' && a.__fns) { var o3 = {}; Object.keys(a.__fns).forEach(function (k) { o3[k] = function () { return a.__fns[k]; }; }); return o3; }
        if (Array.isArray(a)) return a.map(materialize);
        if (a && typeof a === 'object') { var o2 = {}; Object.keys(a).forEach(function (k) { o2[k] = materialize(a[k]); }); return o2; }
        return a;
      };

      window.addEventListener('message', function (e) {
        var m = e.data;
        if (!m || !m.aiEdit) return;
        var reply = function (payload) { try { e.source.postMessage({ aiEdit: true, id: m.id, result: payload }, '*'); } catch (_) {} };
        var done = function (data) { reply({ ok: true, op: m.op, data: data }); };
        var fail = function (err) { reply({ ok: false, op: m.op, error: (err && err.message) ? err.message : String(err) }); };
        var op = m.op;
        try {
          var editor = getEditor();
          if (!editor) { fail(new Error('OnlyOffice editor not ready (window.editor missing)')); return; }
          switch (op) {
            case 'getState':
              done(readState(editor));
              break;
            /* 动态注入：AI 传代码 → new Function 执行（调试用，免改文件重载） */
            case 'eval': {
              var code = String(m.code || '');
              if (!code) { fail(new Error('eval requires code')); break; }
              try {
                var fn = new Function('editor', 'ctx', 'return (' + code + ')');
                var result = fn(editor, { readState: readState, classifyKind: classifyKind, describeOne: describeOne, getEditor: getEditor });
                var out;
                if (result === undefined || result === null) out = null;
                else if (typeof result === 'string') out = result.slice(0, 4000);
                else { try { out = JSON.stringify(result); if (out && out.length > 4000) out = out.slice(0, 4000); } catch (e) { out = '[unserializable]'; } }
                done({ ok: true, result: out });
              } catch (e) { fail(e); }
              break;
            }
            /* 复合 op：styleText —— find 定位文本 + 一次应用 对齐/字体/颜色/粗体/斜体/字号 */
            case 'styleText': {
              var find = String(m.find || '');
              if (!find) { fail(new Error('styleText requires find')); break; }
              try {
                var applied = {};
                /* 移动元素（按 find 文本定位 shape → shiftXfrm） */
                if ((m.moveX || m.moveY) && editor.WordControl) {
                  try {
                    var ld2 = editor.WordControl.m_oLogicDocument;
                    outer: for (var si2 = 0; si2 < ld2.Slides.length; si2++) {
                      var sp2 = ld2.Slides[si2].cSld.spTree;
                      if (!sp2) continue;
                      for (var jj = 0; jj < sp2.length; jj++) {
                        try {
                          var dc2 = sp2[jj].getDocContent ? sp2[jj].getDocContent() : null;
                          var tt = dc2 && typeof dc2.GetText === 'function' ? String(dc2.GetText()) : '';
                          if (tt.indexOf(find) !== -1) {
                            sp2[jj].shiftXfrm(Number(m.moveX) || 0, Number(m.moveY) || 0);
                            try { if (sp2[jj].recalcTransform) sp2[jj].recalcTransform(); } catch (e) {}
                            try { if (sp2[jj].updateTransformMatrix) sp2[jj].updateTransformMatrix(); } catch (e) {}
                            applied.move = { x: Number(m.moveX) || 0, y: Number(m.moveY) || 0, pageIdx: si2, shapeIdx: jj };
                            break outer;
                          }
                        } catch (e) {}

                var r = mid.getBoundingClientRect();
                done({ ok: true, visible: visible, middleTop: Math.round(r.top), middleHeight: Math.round(r.height) });
              } catch (e) { fail(e); }
              break;
            }
            /* ===== Word 专项 op（documenteditor：pluginMethod/asc 层，触发重绘+保存） ===== */
            case 'wordSetTrackRevisions': {
              var revOn = m.enabled !== false;
              try {
                if (typeof editor.asc_SetTrackRevisions !== 'function') { fail(new Error('修订模式仅 Word 编辑器支持')); break; }
                editor.asc_SetTrackRevisions(revOn);
                var revNow = editor.asc_IsTrackRevisions ? editor.asc_IsTrackRevisions() : revOn;
                done({ ok: true, enabled: !!revNow });
              } catch (e) { fail(e); }
              break;
            }
            case 'wordAcceptRevision': {
              try {
                // 全量接受：pluginMethod_AcceptReviewChanges 只处理当前修订，AI 意图通常是全量
                if (typeof editor.asc_AcceptAllChanges !== 'function') { fail(new Error('asc_AcceptAllChanges 不可用')); break; }
                editor.asc_AcceptAllChanges();
                done({ ok: true, all: true });
              } catch (e) { fail(e); }
              break;
            }
            case 'wordRejectRevision': {
              try {
                if (typeof editor.asc_RejectAllChanges !== 'function') { fail(new Error('asc_RejectAllChanges 不可用')); break; }
                editor.asc_RejectAllChanges();
                done({ ok: true, all: true });
              } catch (e) { fail(e); }
              break;
            }
            case 'wordSearchReplace': {
              var wFind = String(m.find || '');
              if (!wFind) { fail(new Error('wordSearchReplace requires find')); break; }
              try {
                if (typeof editor.pluginMethod_SearchAndReplace !== 'function') { fail(new Error('pluginMethod_SearchAndReplace 不可用')); break; }
                var srr = editor.pluginMethod_SearchAndReplace({ searchString: wFind, replaceString: String(m.replace || ''), matchCase: !!m.matchCase });
                done({ ok: true, find: wFind, replace: String(m.replace || ''), matchCase: !!m.matchCase, ret: srr == null ? null : String(srr) });
              } catch (e) { fail(e); }
              break;
            }
            case 'wordReadFullText': {
              try {
                if (typeof editor.asc_EditSelectAll !== 'function' || typeof editor.pluginMethod_GetSelectedText !== 'function') { fail(new Error('读全文 API 不可用')); break; }
                editor.asc_EditSelectAll();
                var wFull = String(editor.pluginMethod_GetSelectedText() || '').replace(/\r\n/g, '\n');
                if (typeof editor.asc_RemoveSelection === 'function') editor.asc_RemoveSelection();
                done({ ok: true, text: wFull, chars: wFull.length });
              } catch (e) { fail(e); }
              break;
            }
          }
        } catch (err) { fail(err); }
      });
    })();
  </script>
</html>
